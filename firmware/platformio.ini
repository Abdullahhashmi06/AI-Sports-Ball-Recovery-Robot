; AI-Sports-Ball-Recovery-Robot — ESP32 firmware (PlatformIO)
;
; Bring-up skeleton: laptop <-> ESP32 communication only.  No motors,
; encoders, ultrasonics or IMU are wired yet — the hardware port in
; src/main.cpp returns "not implemented" for anything that would actuate.
;
; The protocol engine lives in lib/protocol/ so the same code compiles into
; the firmware AND into the host ("native") unit-test binary:
;
;     pio run                # build the firmware
;     pio run -t upload      # flash to the ESP32 (USB serial, 115200 8N1)
;     pio test -e native     # run the protocol unit tests on the host
;
; The board below is the generic ESP32 DevKit (classic ESP32 + USB-UART
; bridge).  Exact USB bridge choice is protocol open decision OD-15
; (docs/COMMUNICATION_PROTOCOL.md section 14).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -std=gnu++17

[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -std=gnu++17
